<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>engine · seek(t) 动画模板</title>
<!--
  seek(t) 模板：画面只由时间 t 决定。移植自 chuspeeism/code-video-director（MIT），部分思路来自 howseen-ai/claude-motion-design（MIT）
  渲染：node <skill>/scripts/render.mjs engine.html --out out --fps 30 --workers 4
  预览：直接用浏览器打开本文件 → 自动缩放到窗口循环播放；空格 暂停/继续，← → 逐帧
  约定：
    window.seek(t)     t 单位秒，只靠 t 算画面；不许用 setTimeout / setInterval / CSS transition / CSS animation
    window.ready=true  字体等资源就绪后再设（本模板等 document.fonts.ready）
    window.DURATION    默认时长（秒），render.mjs 没给 --dur 时用它
  注意：第 2 节的演示场景只演示函数怎么用（单镜头、纸色大底），不是合格的成片构图，video_qa.py 会对它报警告。
        做片时整段换掉，构图按 references/composition.md。
  结构：#stage（舞台，尺寸改 :root 的 --W/--H）
          ├─ canvas#fx   Canvas 层（点阵、曲线、粒子……），用 ctxCamera() 跟相机走
          └─ div#world   DOM 层（文字、色块……），用 cssCamera() 跟相机走
-->
<style>
:root {
  --W: 1920; --H: 1080;                      /* 舞台尺寸：改这里，渲染时 --w/--h 跟着改 */
  --paper: #ECE8DF; --ink: #17160F; --muted: #87827A; --accent: #F0532B; --line: rgba(23, 22, 15, .16);
  --sans: "Inter", "SF Pro Display", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --serif: Georgia, "Times New Roman", "Songti SC", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0c; }
#stage {
  position: relative; width: calc(var(--W) * 1px); height: calc(var(--H) * 1px); overflow: hidden;
  background: var(--paper); color: var(--ink); font-family: var(--sans); transform-origin: 0 0;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
}
#fx { position: absolute; left: 0; top: 0; }
#world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
.abs { position: absolute; }
/* 按词遮罩升起：.w 是遮罩（overflow:hidden），.wi 是真正移动的那层 */
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: .06em 0 .14em; margin: -.06em 0 -.14em; }
.wi { display: inline-block; transform-origin: 0 100%; }

/* ---------- 演示场景的样式（换场景时随便改） ---------- */
.label { font: 500 22px/1 var(--mono); letter-spacing: .14em; color: var(--ink); text-transform: uppercase; }
.label b { color: var(--accent); font-weight: 500; }
#clock { font-variant-numeric: tabular-nums; letter-spacing: .06em; text-transform: none; }
.rule { height: 2px; background: var(--ink); transform-origin: 0 50%; }
.title { font-size: 172px; font-weight: 700; line-height: 1.04; letter-spacing: -.035em; white-space: nowrap; }
.sub { font-size: 42px; font-weight: 400; line-height: 1.25; letter-spacing: -.01em; color: var(--muted); white-space: nowrap; }
.sub em { font-style: normal; color: var(--ink); }
.bar { width: 128px; height: 12px; background: var(--accent); transform-origin: 0 50%; }
#block {
  left: 1480px; top: 470px; width: 400px; height: 400px; margin: -200px 0 0 -200px; background: var(--accent);
  color: #fff; border-radius: 6px; box-shadow: 0 40px 80px -30px rgba(120, 30, 0, .45);
}
#block .tag { left: 28px; top: 28px; font: 500 18px/1 var(--mono); letter-spacing: .14em; opacity: .8; }
#block .glyph { left: 0; right: 0; top: 118px; text-align: center; font: italic 400 150px/1 var(--serif); letter-spacing: -.02em; }
.axis { font: 400 20px/1 var(--mono); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.foot { font: 400 20px/1 var(--mono); color: var(--muted); letter-spacing: .08em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>
  <div id="world">
    <div class="abs label" id="brand" style="left:140px; top:104px">Video&nbsp;Director&nbsp;&nbsp;<b>/</b>&nbsp;&nbsp;Engine</div>
    <div class="abs label" id="clock" style="right:140px; top:104px">t = 0.00 s</div>
    <div class="abs rule" id="rule" style="left:140px; top:148px; width:1640px"></div>

    <!-- data-split="word"：按空格分词（中文自己用空格断开）；data-split="char"：逐字；data-gap 是词间距 -->
    <h1 class="abs title" id="title" style="left:128px; top:262px" data-split="word" data-gap="0">用代码<br>导演 每一帧</h1>
    <div class="abs bar" id="bar" style="left:140px; top:660px"></div>
    <p class="abs sub" id="sub" style="left:140px; top:712px" data-gap=".26em">Every frame is a <em>pure function</em> of time.</p>

    <div class="abs" id="block">
      <div class="abs tag">SPRING · f 2.6 · ζ 0.5</div>
      <div class="abs glyph" id="glyph">f(t)</div>
    </div>
    <div class="abs axis" id="axisTitle" style="left:1180px; top:956px">spring(τ) · τ = 0 → 3 s</div>
    <div class="abs axis" id="axisOne" style="left:1124px; top:780px">1.0</div>

    <div class="abs foot" id="foot" style="left:140px; top:956px">seek(t) → frame　·　1920 × 1080　·　deterministic</div>
  </div>
</div>
<script src="lib.js"></script>
<script>
/* 第 1 节的工具函数在 lib.js 里（和本文件放在同一个目录） */
/* =================== 2. 场景（改这里） =================== */
const DURATION = 6;
window.DURATION = DURATION;
const $ = (id) => document.getElementById(id);
const world = $('world'), fx = $('fx'), ctx = fx.getContext('2d');
fx.width = W; fx.height = H;
const titleWords = splitWords($('title')), subWords = splitWords($('sub'));
const BLOCK_T = 1.5, F = 2.6, Z = 0.5;                        // 方块入场时刻、弹簧频率、阻尼比（canvas 曲线共用）；f 2.5–4 才利落
const HIT = BLOCK_T + 0.12;                                    // 方块落地那一帧（drop 默认 0.12 秒砸到位）
const CAM = [{ t: 0, x: 960, y: 540, s: 1 }, { t: 2.4, x: 960, y: 540, s: 1 },                  // 镜头先不动，让动作在静止的镜头里发生
  { t: 3.0, x: 930, y: 530, s: 1.04, ease: E.outCubic }, { t: DURATION, x: 930, y: 530, s: 1.04 }]; // 字都出完后补一个短推，推完停住
const PLOT = { x0: 1180, x1: 1780, y0: 930, y1: 790, T: 3 };  // 曲线区域：τ 0–3 秒 → x0–x1，值 0–1 → y0–y1
const ACCENT = ROOT.getPropertyValue('--accent').trim(), PAPER = ROOT.getPropertyValue('--paper').trim();
const rnd = mulberry32(7), DOTS = [];
for (let y = 20; y < H; y += 40) for (let x = 20; x < W; x += 40) DOTS.push([x, y, 1.1 + rnd() * 1.3]);

function draw(t, cam) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctxCamera(ctx, mixCam(cam, 0.45));                          // 背景点阵只跟相机走 45%，形成视差
  ctx.fillStyle = `rgba(23,22,15,${0.11 * E.outCubic(seg(t, 0, 1.2))})`;
  for (const [x, y, r] of DOTS) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

  ctxCamera(ctx, cam);
  const P = PLOT, show = E.outCubic(seg(t, 1.3, 1.9)), tau = clamp(t - BLOCK_T, 0, P.T);
  const at = (u) => [lerp(P.x0, P.x1, u / P.T), lerp(P.y0, P.y1, spring(u, F, Z))];
  ctx.globalAlpha = show;
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(23,22,15,.28)'; ctx.setLineDash([6, 9]);
  ctx.beginPath(); ctx.moveTo(P.x0, P.y1); ctx.lineTo(P.x1, P.y1); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(23,22,15,.55)';
  ctx.beginPath(); ctx.moveTo(P.x0, P.y0); ctx.lineTo(lerp(P.x0, P.x1, E.outExpo(seg(t, 1.3, 2.1))), P.y0); ctx.stroke();
  for (let k = 0; k <= 6; k++) {
    const x = lerp(P.x0, P.x1, k / 6), q = E.outCubic(seg(t, 1.4 + k * 0.05, 1.8 + k * 0.05));
    ctx.beginPath(); ctx.moveTo(x, P.y0); ctx.lineTo(x, P.y0 + 12 * q); ctx.stroke();
  }
  if (t > BLOCK_T) {                                           // 曲线画到「此刻」：和方块用的是同一个 spring
    ctx.strokeStyle = ACCENT; ctx.lineWidth = 4; ctx.lineJoin = ctx.lineCap = 'round'; ctx.beginPath();
    for (let k = 0; k <= 240; k++) { const [x, y] = at((tau * k) / 240); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    const [hx, hy] = at(tau);
    ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.arc(hx, hy, 10, 0, 7); ctx.fill();
    ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(hx, hy, 4.5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

window.seek = async (t) => {
  const cam = cameraAt(t, CAM);
  cam.s *= 1 + punch(t, HIT, 0.035);                           // 方块砸地那一刻镜头顿推 3.5%，0.2 秒内衰减回来
  cam.y += shake(t, HIT, 6, 0.18);                             // 轻微震屏
  cssCamera(world, cam);
  fade($('brand'), E.outCubic(seg(t, 0.05, 0.7)));
  fade($('clock'), E.outCubic(seg(t, 0.15, 0.8)));
  $('clock').textContent = `t = ${t.toFixed(2)} s`;
  $('rule').style.transform = `scaleX(${E.inOutCubic(seg(t, 0.1, 1.3))})`;
  riseWords(titleWords, t, 0.3, { stagger: 0.08, dur: 0.6 });
  riseWords(subWords, t, 0.9, { stagger: 0.04, dur: 0.5, tilt: 2 });
  $('bar').style.transform = `scaleX(${E.outExpo(seg(t, 2.1, 2.9))})`;
  const k = drop(t, BLOCK_T), sq = squash(t - HIT, 0.12);      // 方块：0.12 秒先慢后快砸下来，落地压扁 12%、两三帧弹回、再弹两下稳住
  $('block').style.opacity = t < BLOCK_T ? 0 : 1;
  $('block').style.transform = `translateY(${(1 - k) * -560}px) scale(${1 + 0.5 * sq}, ${1 - sq}) rotate(${(1 - Math.min(k, 1)) * -6}deg)`;
  const g = E.outExpo(seg(t, BLOCK_T + 0.2, BLOCK_T + 0.65));
  $('glyph').style.opacity = g; $('glyph').style.transform = `translateY(${(1 - g) * 36}px)`;
  fade($('axisTitle'), E.outCubic(seg(t, 1.5, 2.1)));
  fade($('axisOne'), E.outCubic(seg(t, 1.6, 2.2)));
  fade($('foot'), E.outCubic(seg(t, 2.5, 3.3)));
  draw(t, cam);
};

/* =================== 3. 就绪 + 浏览器预览（渲染时不走预览） =================== */
const RENDER = navigator.webdriver === true || /[?&]render\b/.test(location.search);
function startPreview() {
  const st = $('stage');
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H);
    st.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - H * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  let playing = true, cur = 0, last = performance.now();
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { playing = !playing; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
      playing = false; cur = clamp(cur + (e.code === 'ArrowRight' ? 1 : -1) / 30, 0, DURATION); window.seek(cur);
    }
  });
  const loop = (now) => { if (playing) { cur = (cur + Math.max(0, now - last) / 1000) % DURATION; window.seek(cur); } last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
document.fonts.ready.then(async () => { await window.seek(0); window.ready = true; if (!RENDER) startPreview(); });
</script>
</body>
</html>
